packages:
  # The shared platform. Brand-blind by construction: nothing under here may
  # name a brand (check-boundaries rule 1). Piggles, the sister brand, lives in
  # its own repository (wizeworksllc/piggles) and installs the published packages.
  - 'wizeworks/packages/*'
  - 'wizeworks/services/*'
  - 'wizeworks/apps/*'
  # sparx's own apps and marks live in their own repository too
  # (wizeworksllc/sparx, docs/153 Phase 5) and install the published packages.

# Single source of truth for the @wizeworks/silicaui family versions. Consuming
# apps reference these as "catalog:" in their package.json (e.g.
# "@wizeworks/silicaui": "catalog:") so a version bump happens in one place, not
# across market/dashboard/site/web. The family is scoped under @wizeworks/* and
# published to the registry — these pins install straight from it (the earlier
# local `pnpm.overrides` link block has been removed). Bump here when a new
# version ships; keep every entry on the same version so the family stays unified.
catalog:
  '@wizeworks/silicaui': ^0.60.3
  '@wizeworks/silicaui-react': ^0.60.3
  '@wizeworks/silicaui-html': ^0.60.3
  '@wizeworks/silicaui-behaviors': ^0.60.3
  '@wizeworks/silicaui-mcp': ^0.60.3
  '@wizeworks/silicaui-editor': ^0.60.3
  '@wizeworks/silicaui-dnd': ^0.61.0
  '@wizeworks/silicaui-panels': ^0.60.3
  '@wizeworks/silicaui-charts': ^0.60.3
  '@wizeworks/silicaui-table': ^0.60.3
  '@wizeworks/silicaui-builder': ^0.60.3
