apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sparx-prod
resources:
  - web.yaml
  - api-rest.yaml
  - api-graphql.yaml
  - api-mcp.yaml
  - mcp-site.yaml
  # dashboard.yaml removed 2026-07-22 — the workbench replaced the dashboard at
  # app.sparx.works. `kubectl apply -k` does NOT prune the dropped Deployment;
  # run `bootstrap.yml -f components=dashboard-teardown` once to delete the
  # orphaned in-cluster resources (same pattern as storefront-teardown).
  - workbench.yaml
  - site.yaml
  - market.yaml
  # admin.yaml removed 2026-10-27 — the WizeWorks staff console ships from the
  # wizeworks repo into the `wizeworks` namespace now. The release's label-based
  # prune deletes the old Deployment and Service.
  # Piggles' three apps left this namespace for their own, `piggles`, released
  # from wizeworksllc/piggles (docs/153, Phase 4). They still use this
  # namespace's api-rest. The label-based prune deleted the old copies here.
# Add per-app manifests here as they ship to Artifact Registry.
